<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Happy Monthsary, My Love</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ====== EDIT THESE ====== */
/* Her name, month number, and messages are in the script at the bottom (CONFIG). */
:root{--rose:#e8527a;--blush:#ffe3ec;--deep:#7a1f3d;--cream:#fff8fa}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:'Quicksand',sans-serif;color:#ffe3ec;background:radial-gradient(circle at 50% 30%,#6a1d3d,#3d1027 55%,#24091a)}
.hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.hearts span{position:absolute;bottom:-30px;color:var(--rose);opacity:.35;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
.deck{display:flex;height:100%;width:600%;transition:transform .7s cubic-bezier(.65,.05,.25,1)}
.slide{width:16.6667%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 22px 70px;position:relative}
h1,h2{font-family:'Dancing Script',cursive;color:#ff8fb1;line-height:1.1;text-shadow:0 2px 14px rgba(255,100,150,.35)}
h1{font-size:clamp(2.6rem,10vw,4.6rem)}
h2{font-size:clamp(2rem,7vw,3rem);margin-bottom:14px}
p{max-width:420px;line-height:1.7;font-size:1.05rem}
.big{font-size:3.6rem;letter-spacing:-.05em;animation:beat 1.3s infinite}
@keyframes beat{0%,100%{transform:scale(1)}30%{transform:scale(1.18)}60%{transform:scale(.97)}}
.sub{margin-top:10px;letter-spacing:.2em;text-transform:uppercase;font-size:.8rem;opacity:.8}
/* heart of photos */
.heart{display:grid;grid-template-columns:repeat(5,46px);grid-auto-rows:46px;gap:5px;margin:8px 0 14px}
.heart .c{width:46px;height:46px;border-radius:50%;background:var(--blush) center/cover no-repeat;border:2px solid #fff;box-shadow:0 3px 10px rgba(232,82,122,.35);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.1rem;color:var(--rose);transition:transform .25s}
.heart .c:hover{transform:scale(1.25);z-index:2}
.heart .e{visibility:hidden}
.btn{background:var(--rose);color:#fff;border:0;border-radius:30px;padding:10px 22px;font:600 .95rem 'Quicksand';cursor:pointer;box-shadow:0 4px 14px rgba(232,82,122,.4)}
.small{font-size:.78rem;opacity:.7;margin-top:8px}
/* cards */
.cards{display:grid;gap:12px;max-width:420px;width:100%}
.card{color:var(--deep);background:var(--cream);border-radius:18px;padding:14px 18px;box-shadow:0 4px 16px rgba(122,31,61,.12);text-align:left;opacity:0;transform:translateY(16px);transition:.6s}
.slide.on .card{opacity:1;transform:none}
.slide.on .card:nth-child(2){transition-delay:.2s}.slide.on .card:nth-child(3){transition-delay:.4s}.slide.on .card:nth-child(4){transition-delay:.6s}
.card b{color:var(--rose)}
.counter{font-family:'Dancing Script',cursive;font-size:clamp(4rem,18vw,7rem);color:#ff8fb1;line-height:1}
.letter{color:var(--deep);background:var(--cream);padding:26px 24px;border-radius:20px;box-shadow:0 6px 24px rgba(122,31,61,.15);max-width:440px}
.letter p{margin-bottom:10px}
.sign{font-family:'Dancing Script',cursive;font-size:1.8rem;color:var(--rose)}
nav{position:fixed;bottom:18px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:14px;z-index:5}
nav button{background:#fff;border:0;border-radius:50%;width:40px;height:40px;font-size:1.1rem;color:var(--rose);box-shadow:0 3px 10px rgba(0,0,0,.15);cursor:pointer}
.dots{display:flex;gap:8px}
.dots i{width:10px;height:10px;border-radius:50%;background:#fff;opacity:.6;transition:.3s;cursor:pointer}
.dots i.on{background:var(--rose);opacity:1;transform:scale(1.35)}
/* vines & flowers: four mirrored corners, kept clear of the text */
.slide{overflow:hidden;padding:112px 22px 96px}
.slide>*:not(.vine){position:relative;z-index:2}
.vine{position:absolute;z-index:0;pointer-events:none;width:clamp(90px,22vw,150px);aspect-ratio:1}
.vine svg{width:100%;height:100%;display:block;transform-origin:0 0;animation:sway 4.5s ease-in-out infinite alternate;will-change:transform}
.vine.tr svg{animation-delay:-1.2s}.vine.bl svg{animation-delay:-2.4s}.vine.br svg{animation-delay:-3.4s}
.vine.tl{top:0;left:0}
.vine.tr{top:0;right:0;transform:scaleX(-1)}
.vine.bl{bottom:0;left:0;transform:scaleY(-1)}
.vine.br{bottom:0;right:0;transform:scale(-1,-1)}
@keyframes sway{0%{transform:rotate(-6deg) skewX(-2deg)}100%{transform:rotate(6deg) skewX(2deg)}}
@media (max-height:640px){.slide{padding:84px 22px 80px}.vine{width:80px}}
.heart .c{position:relative;overflow:visible}
.heart .c:not(.e)::after{content:'🌸';position:absolute;top:-9px;right:-7px;font-size:15px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.3))}
.heart .c:not(.e):nth-child(3n)::after{content:'🌼'}
.heart .c:not(.e):nth-child(4n)::after{content:'🌷'}
.heart{filter:drop-shadow(0 0 14px rgba(255,120,170,.35))}
/* flower animation */
.fl{transform-box:fill-box;transform-origin:center;animation:bloom 3.6s ease-in-out infinite}
@keyframes bloom{0%{transform:scale(.82) rotate(0deg)}50%{transform:scale(1.15) rotate(18deg)}100%{transform:scale(.82) rotate(0deg)}}
.lf{transform-box:fill-box;transform-origin:left center;animation:flutter 4.2s ease-in-out infinite}
@keyframes flutter{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(7deg)}}
.heart .c:not(.e)::after{animation:wiggle 3s ease-in-out infinite;transform-origin:50% 80%}
.heart .c:nth-child(2n)::after{animation-delay:-1s}.heart .c:nth-child(3n)::after{animation-delay:-2s}
@keyframes wiggle{0%,100%{transform:rotate(-12deg) scale(1)}50%{transform:rotate(12deg) scale(1.18)}}
.petals{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.petals span{position:absolute;top:-30px;opacity:.55;animation:fall linear infinite}
@keyframes fall{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(30px,55vh) rotate(180deg)}100%{transform:translate(-20px,112vh) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.fl,.lf,.vine svg,.petals span,.heart .c::after{animation:none!important}}
/* memory slide */
.memory{margin:0;display:flex;flex-direction:column;align-items:center;gap:16px;width:100%;max-width:340px}
.memory img{display:block;width:auto;max-width:100%;max-height:calc(100vh - 340px);min-height:160px;object-fit:contain;border-radius:18px;border:3px solid #fff;box-shadow:0 8px 28px rgba(0,0,0,.45)}
.memory figcaption{width:100%;min-height:2.6em;font-family:'Quicksand',Arial,sans-serif;font-weight:600;font-size:1.1rem;line-height:1.5;color:#ffe3ec;text-align:center;outline:none;margin-bottom:28px;padding:4px 8px;border-radius:10px;word-break:break-word}
.memory figcaption:empty::before{content:attr(data-placeholder);opacity:.55;font-size:.95rem}
.memory figcaption:focus{background:rgba(255,255,255,.08)}
</style>
</head>

<div class="hearts" id="floaters"></div>
<div class="petals" id="petals"></div>

<div class="deck" id="deck">

    <div class="sub">2 years &amp; 2 months together 💕</div>
    <div class="sub" style="margin-top:22px"></div>
  </section>

  <section class="slide">
    <h2>You Have My Heart</h2>

    <button class="btn" id="addBtn">📷 wews</button>
    <input type="file" id="file" accept="image/*" multiple hidden>
    <div class="small">Yaduduy Gayun Sana.</div>

  <section class="slide">

  <section class="slide">

    <p style="margin-top:12px" id="sinceTxt"></p>
  </section>

  <section class="slide">

function shrink(file){
  return new Promise(res=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{
      const s=120, cv=document.createElement('canvas'); cv.width=cv.height=s;
      const m=Math.min(img.width,img.height), g=cv.getContext('2d');
      g.drawImage(img,(img.width-m)/2,(img.height-m)/3,m,m,0,0,s,s); // crop square, bias to face
      URL.revokeObjectURL(url); res(cv.toDataURL('image/jpeg',.8));
    };
    img.src=url;
  });
}
$('addBtn').onclick=()=>$('file').click();
$('file').onchange=async e=>{
  photos = await Promise.all([...e.target.files].map(shrink));
  try{ localStorage.setItem('monthsaryPhotos',JSON.stringify(photos)); }catch(e){}
  paint();
};
paint();

/* ============ slides ============ */
const slides=[...document.querySelectorAll('.slide')];
let cur=0;
slides.forEach((_,i)=>{const d=document.createElement('i');d.onclick=()=>go(i);$('dots').appendChild(d);});
function go(n){
  cur=Math.max(0,Math.min(slides.length-1,n));
  $('deck').style.transform=`translateX(-${cur*100/slides.length}%)`;
  slides.forEach((s,i)=>s.classList.toggle('on',i===cur));
  [...$('dots').children].forEach((d,i)=>d.classList.toggle('on',i===cur));
}
$('prev').onclick=()=>go(cur-1); $('next').onclick=()=>go(cur+1);
addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1);});
let x0=null;
addEventListener('touchstart',e=>x0=e.touches[0].clientX,{passive:true});
addEventListener('touchend',e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>50)go(cur+(dx<0?1:-1));x0=null;});
/* editable caption under the memory photo (saved on this device) */
(function(){
  const cap=document.getElementById('caption');
  let saved=''; try{saved=localStorage.getItem('monthsaryCaption')||'';}catch(e){}
  cap.textContent = saved || CONFIG.caption || '';
  cap.addEventListener('input',()=>{try{localStorage.setItem('monthsaryCaption',cap.textContent);}catch(e){}});
  cap.addEventListener('keydown',e=>e.stopPropagation()); // arrow keys edit text instead of changing slides
})();
/* falling petals */
for(let i=0;i<9;i++){const p=document.createElement('span');p.textContent=['🌸','🌸','🌼'][i%3];p.style.left=(5+i*11)+'%';p.style.fontSize=(13+(i%3)*4)+'px';p.style.animationDuration=(12+(i*1.7)%8)+'s';p.style.animationDelay=(-i*2.3)+'s';document.getElementById('petals').appendChild(p);}
/* ============ vines with flowers ============ */
let _fi=0;
const flower=(x,y,r,c)=>{const d=((_fi++)*0.7%4).toFixed(1);return `<g transform="translate(${x} ${y})"><g class="fl" style="animation-delay:-${d}s">`+[0,72,144,216,288].map(a=>`<ellipse cx="0" cy="${-r}" rx="${r*.7}" ry="${r}" fill="${c}" transform="rotate(${a})"/>`).join('')+`<circle r="${r*.5}" fill="#ffd54f"/></g></g>`;};
const leaf=(x,y,a)=>`<g transform="rotate(${a} ${x} ${y})"><ellipse class="lf" cx="${x}" cy="${y}" rx="11" ry="4.5" fill="#6bbf7a" style="animation-delay:-${(Math.abs(x+y)%5)*0.6}s"/></g>`;
const VINE=`<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
<path d="M-5,-5 C55,12 28,62 76,80 C112,94 100,125 128,138" stroke="#4f9d5f" stroke-width="4" fill="none" stroke-linecap="round"/>
<path d="M26,26 C58,28 84,14 112,16" stroke="#4f9d5f" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M76,80 C100,66 126,72 148,56" stroke="#4f9d5f" stroke-width="3" fill="none" stroke-linecap="round"/>
${leaf(16,12,35)}${leaf(46,44,140)}${leaf(62,22,-25)}${leaf(88,92,160)}${leaf(104,112,30)}${leaf(112,70,-30)}
${flower(112,16,9,'#ff8fb1')}${flower(148,56,8,'#ffd1de')}${flower(28,27,8,'#ff6f9c')}${flower(76,80,10,'#ffb3c9')}${flower(128,138,9,'#ff8fb1')}
</svg>`;
slides.forEach(s=>{
  s.insertAdjacentHTML('afterbegin',['tl','tr','bl','br'].map(c=>`<div class="vine ${c}">${VINE}</div>`).join(''));
});
go(0);
</script>
</body>
